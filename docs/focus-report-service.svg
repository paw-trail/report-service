<rect x="622.0" y="387.0" width="396" height="126" rx="18" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.5"/>
<rect x="630.0" y="395.0" width="380" height="110" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="3.5"/>
<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">report-service  :8092</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">제보 · 후기 신고를 받고 관리자가 처리함</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 6개  (공개 2 · 관리자 4)</text>
<text x="622.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="60.0" y="405.0" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2"/>
<text x="180" y="428" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">토큰 검증</text>
<text x="180" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">X-User-Id · X-User-Role 주입</text>
<rect x="670.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 · DB · 하루 제보 상한</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="245.0" width="300" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="270" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  report_db</text>
<text x="1560" y="290" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">report 한 표 + outbox · inbox</text>
<text x="1560" y="306" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">처리 중 같은 제보는 부분 유일 인덱스가 막음</text>
<text x="1560" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">하루 상한도 DB 로 셈 — Redis 안 씀</text>
<rect x="1410.0" y="515.0" width="300" height="90" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="538" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">place-service</text>
<text x="1560" y="558" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">목록의 장소 이름</text>
<text x="1560" y="574" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">GET /internal/places?ids=  100곳씩</text>
<rect x="1410.0" y="655.0" width="300" height="90" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="678" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">user-service</text>
<text x="1560" y="698" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">관리자 목록의 제보자 닉네임 · 사진</text>
<text x="1560" y="714" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">GET /internal/users?ids=</text>
<rect x="550.0" y="770.0" width="300" height="80" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="700" y="788" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Kafka</text>
<text x="700" y="808" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">report.resolved 발행</text>
<text x="700" y="824" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">account.withdrawn 수신</text>
<rect x="100.0" y="770.0" width="240" height="80" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="220" y="796" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">auth-service</text>
<text x="220" y="816" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">탈퇴를 알림</text>
<rect x="1150.0" y="770.0" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="1300" y="788" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">notification-service</text>
<text x="1300" y="808" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">처리 결과를 제보한 사람에게</text>
<text x="1300" y="824" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
