<rect x="428" y="422" width="103" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="480" y="434" font-size="13" font-weight="normal" text-anchor="middle" fill="#3B82F6">공개 2 · 관리자 4</text>
<polyline points="820,160.0 820,395.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="782" y="258" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="820.0" y="269.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
<polyline points="1010.0,450 1120,450 1120,120 1410.0,120" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="1183" y="193" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">등록</text>
<polyline points="1010.0,450 1120,450 1120,300 1410.0,300" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1091" y="366" width="218" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="378" font-size="13" font-weight="normal" text-anchor="middle" fill="#F97316">JPA · Flyway V20 · 처리할 때 행 잠금</text>
<polyline points="1010,480 1200,480 1200,560 1410.0,560" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1208" y="518" width="100" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1212" y="530" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">목록을 만들 때만</text>
<polyline points="1010,495 1240,495 1240,700 1410.0,700" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1248" y="658" width="100" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1252" y="670" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">관리자 목록 때만</text>
<polyline points="900,505 900,660 790,660 790,770" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="908" y="588" width="188" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="912" y="600" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">Outbox 로 발행  (처리마다 한 번)</text>
<polyline points="610,770 610,620 700,620 700,505" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="406" y="620" width="196" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="598" y="632" font-size="13" font-weight="normal" text-anchor="end" fill="#F97316">account.withdrawn 을 받아 지움</text>
<polyline points="340.0,810 550.0,810" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)"/>
<rect x="381" y="790" width="127" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="445" y="802" font-size="13" font-weight="normal" text-anchor="middle" fill="#9CA3AF">account.withdrawn</text>
<polyline points="850.0,810 1150.0,810" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="1006" y="790" width="103" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1010" y="802" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">report.resolved</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">제보를 받을 때와 처리할 때는 다른 서비스를 부르지 않음 — 목록을 만들 때만 place · user 에 이름을 묻고, 못 받으면 그 칸만 비운 채 목록을 냄</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">승인해도 장소 · 조건은 안 바뀜 — 관리자가 place · policy 관리자 API 로 먼저 고치고, 여기서는 결과를 남겨 report.resolved 로 한 번 알림</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">같은 사람의 처리 중 같은 제보는 막고 하루 20건까지 받음 · 탈퇴하면 그 계정 제보를 처리 여부와 상관없이 전부 지움 (Inbox 로 한 번만)</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">report-service 를 중심으로 · 직접 연결된 것만</text></svg>